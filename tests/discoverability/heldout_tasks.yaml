# Held-out discoverability set (added 2026-09-28 with document expansion + reranking).
# Written BLIND to the router's search code and to the expansion generator: nobody ran a
# search to pick or phrase these queries, and gen_tool_expansions.py never sees this file.
# Do NOT tune tool descriptions or expansion prompts against individual tasks here — that
# turns a held-out measurement into a training set. Add new tasks instead.
#
# Held-out HARD discoverability set (independent of the router's BM25 tuning).
# Queries were written as users/agents would phrase them, WITHOUT running any search
# over the catalog; expected tools were labelled by reading catalog.json descriptions.
# `expected` = every tool that genuinely serves the request (discovering ANY counts);
# `expected: []` = negative (no catalog tool can serve it).
# style: lay | jargon | paraphrase | concrete | workflow | crosslingual | ambiguous | negative
# Second pass: independent cold adjudication; revised tasks carry adjudicated: revised.
