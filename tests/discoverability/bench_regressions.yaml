# Regression list for failure classes found by genefoundry-bench runs (#292). Phrased
# generally — NOT the benchmark's question wording, which is held out for re-measurement.
# Every task must stay in the BM25 search top 5 (packaged expansions; pins do not count).
tasks:
  # A pair question must reach the network tool, not only the capped neighbourhood list.
  - id: string-pair-interaction
    category: ppi
    query: do two specific proteins interact with each other
    expected: [stringdb_search_protein_interactions]
  - id: protein-pair-binding-evidence
    category: ppi
    query: is there evidence that one protein binds another named protein
    expected: [stringdb_search_protein_interactions]
  # A disease -> gene -> location question is two searches (instructions say: one intent per
  # search); each half must resolve on its own.
  - id: disease-causal-genes
    category: gene_disease
    query: which genes cause a given disease
    expected: [gencc_get_disease_curations, orphanet_get_disease_genes, clingen_search_validity, gencc_find_curations, hpo_get_genes_for_disease]
  - id: gene-cytogenetic-location
    category: nomenclature
    query: chromosome band location of a gene
    expected: [hgnc_get_gene, hgnc_resolve_symbol]
  # #303: full-text / figure / table requests about one article must reach the passages tool
  # (the reranker floor emptied these; BM25 + expansion must keep them in the top 5).
  - id: article-full-text
    category: literature
    query: full text of a journal article
    expected: [pubtator_get_publication_passages]
  - id: article-figure-legends-tables
    category: literature
    query: figure legends and tables from a paper
    expected: [pubtator_get_publication_passages]
  - id: pmc-paper-tables
    category: literature
    query: read the tables in a PubMed Central paper
    expected: [pubtator_get_publication_passages]
  # 2026-11-19: a regeneration dropped the non-English vocabulary, so a German frequency
  # question fell out of the BM25 shortlist; the manual_keywords overlay now carries it.
  - id: variant-frequency-german
    category: variant_frequency
    query: Wie selten ist eine Genvariante in der Bevölkerung?
    expected: [gnomad_get_variant_frequencies, gnomad_get_variant_details]
  - id: variant-frequency-spanish
    category: variant_frequency
    query: frecuencia de una variante genética en la población general
    expected: [gnomad_get_variant_frequencies, gnomad_get_variant_details]
