# Agent-query evaluation set (offline only; added 2026-11-19, #306).
# 858 distinct `search_tools` queries that LLM agents issued during genefoundry-bench runs
# (dev-split tool-arm traces; experiments/2026-11-19-search-rerank-profile/trace_queries.json).
# Synthetic benchmark queries: no user or patient data. They carry NO gold tool label, so
# `category: agent_trace` marks them unlabeled and `style` records the production outcome
# under router v0.10.8 + Jev floor 0.3 (prod_empty | prod_hits | prod_mixed).
# Use: `uv run python scripts/search_rerank_report.py --tasks tests/discoverability/agent_queries.yaml`
# reports the share each pipeline empties. This is NOT a CI gate or a tuning target:
# keep descriptions and expansions blind to it, as with heldout_tasks.yaml.
