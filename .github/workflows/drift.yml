name: Drift detection

on:
  schedule:
    - cron: "17 */6 * * *" # every 6h at :17 (off-peak; GH drops :00 runs under load)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: drift-${{ github.ref }}
  cancel-in-progress: false

jobs:
  drift:
    # The SSH key is a production-only capability; never expose it to branches or forks.
    if: ${{ github.ref == 'refs/heads/main' && (vars.DRIFT_ENABLED == 'true' || github.event_name == 'workflow_dispatch') }}
    environment: drift-probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRIFT_HEARTBEAT_URL: ${{ secrets.DRIFT_HEARTBEAT_URL }}
    steps:
      - name: Checkout pinned host key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run read-only drift probe through the private forced command
        id: drift
        env:
          DRIFT_SSH_PRIVATE_KEY: ${{ secrets.DRIFT_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/drift-probe-key"
          umask 077
          rm -f "$key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$DRIFT_SSH_PRIVATE_KEY" > "$key"
          unset DRIFT_SSH_PRIVATE_KEY
          set +e
          ssh -nT -F /dev/null -p 2323 -i "$key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/ci/drift_known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o UpdateHostKeys=no \
            -o ClearAllForwardings=yes \
            -o ForwardAgent=no \
            -o RequestTTY=no \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=2 \
            bernt@217.154.76.71 > drift_output.txt 2>&1
          exit_code=$?
          set -e
          printf 'exit_code=%s\n' "$exit_code" >> "$GITHUB_OUTPUT"
          cat drift_output.txt
      - name: Open / update drift issue
        if: ${{ steps.drift.outputs.exit_code == '1' && vars.DRIFT_OPEN_ISSUE != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create tool-drift -c FF0000 -d "Tool-definition drift" --force || true
          existing=$(gh issue list --label tool-drift --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -F drift_output.txt
          else
            gh issue create --label tool-drift \
              --title "Tool-definition drift detected" -F drift_output.txt
          fi
      - name: Close resolved drift issue
        if: ${{ steps.drift.outputs.exit_code == '0' && vars.DRIFT_OPEN_ISSUE != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh issue list --label tool-drift --state open --json number -q '.[].number'); do
            gh issue comment "$n" --body "Drift resolved / baseline re-pinned. Closing."
            gh issue close "$n"
          done
      - name: Unreachable backends (availability, not drift)
        if: ${{ steps.drift.outputs.exit_code == '2' }}
        run: |
          echo "::warning::drift check: some backends were unreachable (availability, not a rug pull)"
      - name: Heartbeat (dead-man's-switch)
        if: ${{ steps.drift.outputs.exit_code == '0' && env.DRIFT_HEARTBEAT_URL != '' }}
        run: curl -fsS -m 10 --retry 3 -o /dev/null "$DRIFT_HEARTBEAT_URL"
      - name: Fail the run unless the native probe is clean
        if: ${{ steps.drift.outputs.exit_code != '0' }}
        run: exit 1
