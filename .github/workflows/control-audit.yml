name: Trusted-builder control audit

on:
  schedule:
    - cron: "31 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    # Opt-in: scheduled runs only when CONTROL_AUDIT_ENABLED=true; manual dispatch stays on main.
    # The control-audit GitHub App and its environment secrets do not exist yet, so the daily run
    # is parked until an administrator creates them (Task 6 Step 3) AND sets the variable
    # (Task 6 Step 5) in docs/superpowers/plans/2026-08-30-control-plane-security-remediation.md.
    # A skipped job reports as success, so while this is parked the only real signal that the
    # control is live is a `schedule` run appearing in the run list -- not a green checkmark.
    # NB: 'refs/heads/main' is hard-coded, so renaming the default branch silently disables
    # manual dispatch here (github.event.repository.default_branch is not available in `if:`).
    if: ${{ (vars.CONTROL_AUDIT_ENABLED == 'true' && github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    # Admin prerequisite: restrict to protected main/default-branch runs and gate the token here.
    environment: control-audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.8.7"
      - name: Install dependencies
        run: uv sync --group dev --frozen
      - name: Create short-lived control-audit token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CONTROL_AUDIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONTROL_AUDIT_APP_PRIVATE_KEY }}
          owner: berntpopp
          repositories: |
            autopvs1-link
            clingen-link
            clinpgx-link
            clinvar-link
            gencc-link
            genefoundry-router
            genereviews-link
            gnomad-link
            gtex-link
            hgnc-link
            hpo-link
            litvar-link
            mavedb-link
            metadome-link
            mgi-link
            mondo-link
            orphanet-link
            panelapp-link
            pubtator-link
            spliceailookup-link
            stringdb-link
            uniprot-link
            vep-link
          permission-metadata: read
          permission-administration: read
      - name: Probe live controls
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: uv run python scripts/audit_container_controls.py --ledger "$RUNNER_TEMP/container-controls.json"
      - name: Validate live ledger
        run: uv run python scripts/validate_container_controls.py "$RUNNER_TEMP/container-controls.json"
      - name: Upload verified live ledger
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-controls-live
          path: ${{ runner.temp }}/container-controls.json
          if-no-files-found: error
          retention-days: 30
