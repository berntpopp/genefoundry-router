name: Trusted-builder control audit

on:
  schedule:
    - cron: "31 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    # Admin prerequisite: restrict to protected main/default-branch runs and gate the token here.
    environment: control-audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.8.7"
      - name: Install dependencies
        run: uv sync --group dev --frozen
      - name: Verify trusted-builder controls
        env:
          GH_TOKEN: ${{ secrets.CONTROL_AUDIT_TOKEN }}
        run: uv run python scripts/audit_container_controls.py --check
