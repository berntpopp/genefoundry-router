name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, typecheck, tests, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.8.7"

      - name: Install dependencies
        run: uv sync --group dev --frozen

      # Source-only gate: validates the staged R-05 ledger without probing any backend.
      - name: Validate HTTP policy v1 adoption ledger
        run: make http-policy-adoption

      # Pinned actionlint (version + sha256) so `make ci-local`'s lint-actions target lints
      # every workflow in CI (F-01). The YAML-parse unit test is the always-on syntax guard.
      - name: Install actionlint (pinned)
        run: |
          set -euo pipefail
          VER=1.7.7
          SHA=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          curl -fsSL -o actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz"
          echo "${SHA}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          sudo mv actionlint /usr/local/bin/actionlint
          actionlint --version

      # Static checks + a single parallel test run (xdist). Fast feedback on every PR.
      - name: Run CI checks (format, lint, typecheck, tests)
        run: make ci-local

      # The offline guard (tests/unit/test_action_pin_comments.py) proves pin comments are
      # self-consistent; it cannot catch one that is uniformly wrong. Resolving the claim
      # needs the network, so it lives here rather than in ci-local. Skips without a token.
      - name: Verify Actions SHA-pin version comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: make lint-action-versions

      # Coverage gate runs only on push to main to avoid a second full test run on
      # every PR iteration (concurrency-cancel + this split are the compute savers).
      - name: Coverage gate
        if: github.event_name == 'push'
        run: make test-cov
