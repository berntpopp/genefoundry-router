name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, typecheck, tests, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          version: "0.8.7"

      - name: Install dependencies
        run: uv sync --group dev --frozen

      # Source-only gate: validates the staged R-05 ledger without probing any backend.
      - name: Validate HTTP policy v1 adoption ledger
        run: make http-policy-adoption

      # Pinned actionlint (version + sha256) so `make ci-local`'s lint-actions target lints
      # every workflow in CI (F-01). The YAML-parse unit test is the always-on syntax guard.
      - name: Install actionlint (pinned)
        run: |
          set -euo pipefail
          VER=1.7.7
          SHA=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          curl -fsSL -o actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz"
          echo "${SHA}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          sudo mv actionlint /usr/local/bin/actionlint
          actionlint --version

      # Static checks + a single parallel test run (xdist). Fast feedback on every PR.
      - name: Run CI checks (format, lint, typecheck, tests)
        run: make ci-local

      # The envelope README's command lines, run over every vector with two more validators
      # (the Python one runs in ci-local). Needs the network, so it is not part of ci-local.
      - name: Envelope schema vectors (check-jsonschema, ajv)
        run: make envelope-check

      # The offline guard (tests/unit/test_action_pin_comments.py) proves pin comments are
      # self-consistent; it cannot catch one that is uniformly wrong. Resolving the claim
      # needs the network, so it lives here rather than in ci-local. Skips without a token.
      - name: Verify Actions SHA-pin version comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: make lint-action-versions

      # Coverage gate runs only on push to main to avoid a second full test run on
      # every PR iteration (concurrency-cancel + this split are the compute savers).
      - name: Coverage gate
        if: github.event_name == 'push'
        run: make test-cov

  community-egress:
    # Federation Standard v1 §2 / #417: the documented host firewall plus the reachability
    # check, on throwaway bridges that mimic the deployment (core and IdP on their own net).
    name: Community egress isolation smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The router image's own pinned base (docker/Dockerfile): stdlib Python, no build.
      PY_IMAGE: python:3.14-slim@sha256:0741d101873c12ab927e6f8653feb8862b9bd58771177acb1b885b95141f91b4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start stand-in core and identity-provider containers
        run: |
          set -euo pipefail
          docker network create gf-core
          for name in core idp; do
            docker run -d --name "$name" --network gf-core "$PY_IMAGE" \
              python -m http.server 8000
          done
          docker network create -o com.docker.network.bridge.name=gf-community gf-community

      - name: Apply the community host firewall
        run: sudo sh scripts/community_firewall.sh gf-community

      - name: Core, IdP, Docker host and metadata are unreachable; the internet is not
        run: |
          set -euo pipefail
          ip_of() { docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$1"; }
          docker run --rm --network gf-community -v "$PWD/scripts:/s:ro" "$PY_IMAGE" \
            python /s/community_egress_check.py \
              --blocked core:8000 --blocked "$(ip_of core):8000" \
              --blocked idp:8000 --blocked "$(ip_of idp):8000" \
              --open github.com:443
